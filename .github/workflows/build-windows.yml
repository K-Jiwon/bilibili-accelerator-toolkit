name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release bundle
        run: bash tools/build_windows_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliAccelerator-Windows
          path: dist/BiliAccelerator-Windows.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/BiliAccelerator-Windows.zip
