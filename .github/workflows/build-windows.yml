name: build-windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse PowerShell scripts (catches ANSI/GBK decoding failures)
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "FAIL $($_.FullName)"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            } else {
              Write-Host "OK   $($_.Name)"
            }
          }
          if ($failed) { exit 1 }

      - name: Compile injector.py
        shell: pwsh
        run: python -m py_compile injector.py

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release bundle
        run: bash tools/build_windows_release.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliAccelerator-Windows
          path: dist/BiliAccelerator-Windows.zip

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BiliAccelerator-Windows.zip
            dist/BiliAccelerator-Windows.zip.sha256
